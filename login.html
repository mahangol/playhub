<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ورود به حساب کاربری | PLAYHUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/reset.css" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/global.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div class="login-page">
  <section class="login-art">
    <div class="login-art-content">
      <a href="index.html" class="navbar-logo">
        <span class="dot"></span>
        <span class="en">PLAYHUB</span>
      </a>
      <h2 class="reveal in-view">به دنیای بازی‌های پلی‌استیشن خوش آمدی.</h2>
      <p class="reveal in-view">وارد حساب کاربری‌ات شو و به کتابخانه‌ای از بهترین بازی‌های روز دسترسی پیدا کن.</p>
    </div>
  </section>

  <section class="login-panel">
    <div class="login-form-wrap reveal in-view">
      <a href="index.html" class="navbar-logo" style="margin-bottom: var(--space-6); display: none;" id="mobileLogo">
        <span class="dot"></span><span class="en">PLAYHUB</span>
      </a>
      <h1>ورود به حساب کاربری</h1>
      <p>خوشحالیم که دوباره می‌بینیمت.</p>

      <form id="loginForm" novalidate>
        <div class="form-field">
          <label for="email">ایمیل</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" class="en" style="text-align:left;direction:ltr" />
        </div>
        <div class="form-field">
          <label for="password">رمز عبور</label>
          <input type="password" id="password" name="password" placeholder="••••••••" class="en" style="text-align:left;direction:ltr" />
        </div>
        <div class="form-row">
          <label class="checkbox-field">
            <input type="checkbox" name="remember" />
            <span>مرا به خاطر بسپار</span>
          </label>
          <a href="#">رمز عبور خود را فراموش کرده‌اید؟</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block">ورود</button>
      </form>

      <div class="form-divider">یا</div>

      <button class="btn-google" id="googleBtn">
        <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.4-1.7 4.1-5.5 4.1-3.3 0-6-2.7-6-6.2s2.7-6.2 6-6.2c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.7 3.2 14.6 2.2 12 2.2 6.9 2.2 2.7 6.5 2.7 12s4.2 9.8 9.3 9.8c5.4 0 8.9-3.8 8.9-9.1 0-.6-.07-1.1-.15-1.5H12z"/></svg>
        <span>ادامه با Google</span>
      </button>

      <p class="login-bottom-link">حساب کاربری ندارید؟ <a href="#">ثبت‌نام کنید</a></p>
    </div>
  </section>
</div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
